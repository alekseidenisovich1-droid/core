<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CORE</title>
  </head>
  <body>
    <main id="app" aria-label="CORE living visual">
      <div id="drag-handle" data-tauri-drag-region aria-hidden="true"></div>
      <div id="scene"></div>
      <section id="hud" data-tauri-drag-region aria-live="polite">
        <div class="hud-kicker">CORE <i></i></div>
        <div id="hud-state">idle</div>
        <dl>
          <div><dt>source</dt><dd id="hud-source">local-sim</dd></div>
          <div><dt>files</dt><dd id="hud-files">0</dd></div>
          <div><dt>commands</dt><dd id="hud-commands">0</dd></div>
          <div><dt>errors</dt><dd id="hud-errors">0</dd></div>
        </dl>
      </section>
      <section id="chaos-controls" aria-label="Chaos experiment controls">
        <label for="chaos-activity">CHAOS SPEED <output id="chaos-activity-value">100%</output></label>
        <input id="chaos-activity" type="range" min="40" max="140" value="100" step="1" />
        <button id="ribbon-relief-toggle" type="button" aria-pressed="true">RIBBON RELIEF · ON</button>
        <label for="ribbon-relief">RIBBON RELIEF <output id="ribbon-relief-value">50%</output></label>
        <input id="ribbon-relief" type="range" min="0" max="100" value="50" step="1" />
        <button id="chaos-living-toggle" type="button" aria-pressed="true">CHAOS · ON</button>
      </section>
      <section id="cube-controls" aria-label="Cube light controls">
        <label for="cube-violet-brightness">VIOLET <output id="cube-violet-brightness-value">100%</output></label>
        <input id="cube-violet-brightness" type="range" min="0" max="200" value="100" step="1" />
        <label for="cube-amber-brightness">AMBER <output id="cube-amber-brightness-value">100%</output></label>
        <input id="cube-amber-brightness" type="range" min="0" max="200" value="100" step="1" />
      </section>
      <div id="hint">6 CUBE · 7 LIVING TERRAIN · ↓/↑ transition speed · 3 ERROR · 4 CRITICAL · 5 CRITICAL 2 · ←/→ effects</div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
