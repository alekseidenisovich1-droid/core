[package]
name = "core-living-desktop"
version = "0.1.0"
description = "A living computational core for the Windows desktop"
authors = ["CORE"]
edition = "2021"

[lib]
name = "core_living_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.37"
